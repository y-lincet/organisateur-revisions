<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPlanner – Organisateur de révisions</title>
  <meta name="description" content="StudyPlanner : organisez vos révisions, suivez votre progression par matière et synchronisez vos tâches en toute sécurité.">
  <meta name="theme-color" content="#4f46e5">
  <meta property="og:title" content="StudyPlanner – Organisateur de révisions">
  <meta property="og:description" content="Planifiez vos révisions, priorisez vos tâches et suivez votre avancement au quotidien.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Cpath d='M50 24 14 42l36 18 28-14v18h8V42L50 24zm-22 30v14c0 6 10 12 22 12s22-6 22-12V54L50 65 28 54z' fill='%23fff'/%3E%3C/svg%3E">
  <!-- Anti-flash : applique le thème sombre avant le premier rendu -->
  <script>
    if (localStorage.getItem('sp-theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Écran de connexion / inscription -->
  <main class="auth-wrapper" id="authView">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
        <h1>StudyPlanner</h1>
        <p>Connecte-toi pour retrouver tes tâches synchronisées.</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">Connexion</button>
        <button type="button" class="auth-tab" data-mode="register">Inscription</button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="authUser">Pseudo</label>
          <input type="text" id="authUser" class="form-input" placeholder="Votre pseudo" required autocomplete="username">
        </div>
        <div class="field">
          <label for="authPass">Mot de passe</label>
          <input type="password" id="authPass" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <p class="auth-error" id="authError" hidden></p>
        <button type="submit" class="btn btn-primary" id="authSubmit">Se connecter</button>
      </form>
    </div>
  </main>

  <!-- Application principale -->
  <div class="app-container" id="appView" hidden>
    <header class="app-header">
      <div class="header-left">
        <div class="brand-icon small"><i class="fas fa-graduation-cap"></i></div>
        <div>
          <h1>StudyPlanner</h1>
          <p class="current-date" id="currentDate"></p>
        </div>
      </div>
      <div class="header-right">
        <button type="button" class="btn-icon" id="themeToggle" title="Changer de thème">
          <i class="fas fa-moon"></i>
        </button>
        <span class="user-badge"><i class="fas fa-user"></i> <strong id="userName"></strong></span>
        <button type="button" class="btn-icon btn-logout" id="logoutBtn" title="Se déconnecter">
          <i class="fas fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- Progression -->
    <section class="card progress-section">
      <div class="progress-header">
        <span>Progression</span>
        <span class="percentage" id="progressPercentage">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div class="progress-stats">
        <span id="completedCount">0 terminée(s)</span>
        <span id="remainingCount">0 restante(s)</span>
      </div>
    </section>

    <!-- Ajout d'une tâche -->
    <section class="card add-task-section">
      <h3>Nouvelle tâche</h3>
      <form id="taskForm">
        <div class="form-row">
          <input type="text" class="form-input" id="taskInput" placeholder="Ex : Fiche de révision chapitre 4..." required>
          <select class="form-select" id="subjectSelect">
            <option value="" disabled selected>— Choisir une matière —</option>
            <option value="Programmation">Programmation</option>
            <option value="Algorithmique">Algorithmique</option>
            <option value="Structures de données">Structures de données</option>
            <option value="Bases de données">Bases de données</option>
            <option value="Réseaux">Réseaux</option>
            <option value="Systèmes d'exploitation">Systèmes d'exploitation</option>
            <option value="Architecture matérielle">Architecture matérielle</option>
            <option value="Sécurité informatique">Sécurité informatique</option>
            <option value="Intelligence artificielle">Intelligence artificielle</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="form-row">
          <select class="form-select" id="prioritySelect">
            <option value="medium">Priorité moyenne</option>
            <option value="high">Priorité haute</option>
            <option value="low">Priorité basse</option>
          </select>
          <input type="date" class="form-input" id="dateInput">
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-plus"></i> Ajouter la tâche
        </button>
      </form>
    </section>

    <!-- Recherche et tri -->
    <div class="toolbar">
      <div class="search-box">
        <i class="fas fa-magnifying-glass"></i>
        <input type="search" id="searchInput" class="form-input" placeholder="Rechercher une tâche ou une matière...">
      </div>
      <select id="sortSelect" class="form-select" aria-label="Trier les tâches">
        <option value="newest">Plus récentes</option>
        <option value="date">Échéance</option>
        <option value="priority">Priorité</option>
      </select>
    </div>

    <!-- Filtres -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Toutes <span class="filter-count" id="countAll">0</span></button>
      <button class="filter-btn" data-filter="active">Actives <span class="filter-count" id="countActive">0</span></button>
      <button class="filter-btn" data-filter="completed">Terminées <span class="filter-count" id="countCompleted">0</span></button>
      <button class="filter-btn" data-filter="high">Prioritaires</button>
    </div>

    <!-- Liste des tâches -->
    <div class="tasks-container" id="tasksContainer"></div>
  </div>

  <!-- Modale d'édition -->
  <dialog class="modal" id="editModal">
    <form id="editForm" class="modal-card">
      <h3>Modifier la tâche</h3>
      <input type="hidden" id="editId">
      <div class="field">
        <label for="editText">Intitulé</label>
        <input type="text" id="editText" class="form-input" required>
      </div>
      <div class="form-row">
        <select class="form-select" id="editSubject">
          <option value="Maths">Maths</option>
          <option value="Physique">Physique</option>
          <option value="Informatique">Informatique</option>
          <option value="Français">Français</option>
          <option value="Anglais">Anglais</option>
          <option value="Histoire">Histoire</option>
          <option value="Autre">Autre</option>
        </select>
        <select class="form-select" id="editPriority">
          <option value="high">Priorité haute</option>
          <option value="medium">Priorité moyenne</option>
          <option value="low">Priorité basse</option>
        </select>
      </div>
      <div class="field">
        <label for="editDate">Date limite</label>
        <input type="date" id="editDate" class="form-input">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="editCancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
